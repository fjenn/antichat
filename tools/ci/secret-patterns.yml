# Secret patterns for tools/ci/bundle-secret-scan.py (M7.T10, AT-255 c1; R-255: the Composio key lives only in the
# relay's Vercel env, never in the app). Parsed by the scanner's own tiny reader (no PyYAML): top-level keys
# `patterns`, `entropy`, `allow`; list items are `- id: …` followed by indented `key: value` lines; values may be
# single-quoted (no escapes inside). Allow regexes are searched (use ^…$ to anchor).
#
# Tuned against a full Debug build/AntiChat.app (330 MB, 163 files) on 2026-11-07: 0 findings; a random 40-char
# base62 string escapes the entropy check (via an allow rule) about 0.2% of the time. The named Composio patterns
# have no such escape.

patterns:
  # Composio project API keys (ak_…) and consumer/user keys (ck_…, uak_…).
  - id: composio-project-key
    regex: '(?<![A-Za-z0-9])ak_[A-Za-z0-9_-]{12,}'
  - id: composio-consumer-key
    regex: '(?<![A-Za-z0-9])ck_[A-Za-z0-9_-]{12,}'
  - id: composio-user-key
    regex: '(?<![A-Za-z0-9])uak_[A-Za-z0-9_-]{12,}'
  # The variable name itself: the app has no reason to mention it.
  - id: composio-env-name
    regex: 'COMPOSIO_API_KEY'
  # Any PEM private key with a body (the app ships none; bare header strings in PEM parsers such as mbedTLS
  # pkparse.cpp are not keys; public keys and certificates are fine, see allow `public-pem`).
  - id: private-key-pem
    regex: '-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----\s*[A-Za-z0-9+/]{32}'

entropy:
  # Printable strings (NUL/space/quote delimited) that are entirely [A-Za-z0-9+/=_-], min_length..max_length long,
  # mix upper, lower and digits, and have Shannon entropy at or above min_bits_per_char are reported unless an
  # allow rule matches or they read as identifiers (a dictionary word of >= 5 letters, CamelCase-split, simple
  # plural/-ed/-ing stems; wordlist below, skipped with a note when absent).
  min_length: '32'
  max_length: '256'
  wordlist: '/usr/share/dict/words'
  min_bits_per_char: '4.6'
  # Media/weights are random bytes by nature: named-pattern checks still run on them, the entropy check does not.
  skip_ext: '.png,.jpg,.jpeg,.heic,.gif,.webp,.car,.icns,.ttf,.otf,.woff,.woff2,.gguf,.safetensors,.bin,.mlmodel,.weights,.wav,.flac,.mp3,.m4a,.mp4,.mov,.zip,.gz,.xz,.zst,.sqlite,.pdf,.nib,.mom,.omo,.metallib'

allow:
  # Known hashes and pins: hex digests (sha1/sha256/sha512, git commit pins), base64 digests as written by
  # codesign (_CodeSignature/CodeResources) and SRI integrity strings, UUIDs.
  - id: hex-digest
    regex: '^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64}|[0-9a-fA-F]{128})$'
  - id: base64-sha-digest
    regex: '^(?:[A-Za-z0-9+/]{27}=|[A-Za-z0-9+/]{43}=|[A-Za-z0-9+/]{86}==)$'
  - id: sri-integrity
    regex: '^sha(?:256|384|512)-[A-Za-z0-9+/]+=*$'
  - id: uuid
    regex: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
  # Every sha256/commit pinned in these repo files is allowed verbatim (paths relative to the repo root).
  - id: pinned-files
    files: 'tools/ci/pins.json,Binaries/checksums.json,catalog/catalog.lock.json'
  # Compiler symbol manglings (Mach-O string tables): C++ Itanium names and typeinfo, Swift ObjC class names,
  # Swift private discriminators, Swift mangling suffixes after a length-prefixed identifier, Rust v0 paths.
  - id: itanium-symbol
    regex: '^_{0,3}Z|^(?:N|P|PK|PF|S|St|K)[A-Za-z]*\d+[A-Za-z_]|^\d+[A-Za-z_]'
  # Itanium tails split off a longer name: constructor/destructor (C2ERKNS_10…, D1Ev…) and `v<len><name>` parameters.
  - id: itanium-fragment
    regex: '^(?:[CD][0-3]E|v\d+[A-Z][a-z])'
  - id: swift-objc-class
    regex: '_Tt[A-Z]'
  - id: swift-private-discriminator
    regex: '\d{2}_[0-9A-Z]{32}'
  - id: swift-mangling-suffix
    regex: '\d[A-Za-z_]{3}.*(?:KF|FZ|lF|tF|vg|Sgv|Sbv|vpfi|Vv|ufC|YaKF|tXCv|VGv|Qrv|SQO|KXEKF|KlF|GSgv|Sgvp|Gv|bcv)$'
  - id: rust-v0-path
    regex: 'NtB\d+_|NtNt|Cs[0-9A-Za-z]{8,14}_\d+[a-z]'
  # Base64/base64url alphabets compiled into codecs.
  - id: base64-alphabet
    regex: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'
  # Base58-style alphabets (no 0/1/I/L/O/i/l/o), e.g. llama-server's random-ID alphabet.
  - id: base58-alphabet
    regex: 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'
  # Embedded images as base64 (PNG, JPEG, GIF data URIs, e.g. favicon fixtures).
  - id: base64-image
    regex: '^(?:iVBORw0KGgo|/9j/|R0lGOD)'
  # Strings inside a PEM public key or certificate block (e.g. DuckDB's extension-signing public keys) are skipped.
  - id: public-pem
    span: '-----BEGIN (PUBLIC KEY|CERTIFICATE)-----.*?-----END \1-----'
