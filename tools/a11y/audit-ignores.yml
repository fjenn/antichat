- element: settings.row.toolAccess.description
  issue: contrast
  reason: >-
    Settings › Tools & Connections (S-21): footnote text that wraps to two lines, now `text.primary` on
    `surface.canvas` / `surface.sunken`, fails the XCUITest contrast audit although it measures far above WCAG AA;
    the same style on one line passes. Measured on the full-screen capture the test attaches when the audit
    reports contrast (a14, 2026-11-11, "S-21 settings.nav.tools (scrolled 1|2|3) contrast"), text extreme vs
    median background, sRGB relative luminance. This element: the Tool access note, 18.1:1. Contrast only, this exact identifier only.
  reviewer: lead (orchestrator) 2026-11-11 — accepted, measured 17.7–18.1:1 on the attached capture; wrapped small text audit artefact
- element: progressIndicator
  issue: parentChild
  scope: countMatched
  reason: >-
    One element-less "Parent/Child mismatch" per AppKit-backed progress indicator (AXProgressIndicator,
    AXBusyIndicator: SwiftUI ProgressView) in the audited window, read by tools/ci/a11y-axstate each audit. In-app
    evidence (a14, 2026-11-11): Settings › Capabilities 7 issues = 4 switches + 3 pack-row progress bars; Storage 1 =
    1 busy indicator. A standalone repro with three linear ProgressViews showed none, so the trigger is not isolated
    (docs/prd/M11-candidates.md §G). A term of the upper bound of `labelsHiddenSwitch` (A-M9-T03b).
  reviewer: lead 2026-11-11 — accepted on in-app helper evidence (capabilities 3 indicators, storage 1 busy indicator, general 1 orphan); standalone repro inconclusive, revisit in M11
- element: quickPanelRecorderClear
  issue: parentChild
  scope: countMatched
  reason: >-
    The quick-panel hotkey recorder (KeyboardShortcuts RecorderCocoa) keeps an AXClearButton its AXChildren do not
    list after its cancel-cell swap (tools/a11y/repros/searchfield-cancel-cell-swap.swift). In-app evidence (a14):
    Settings › General scrolled to it, 9 issues = 8 switches + that orphan, the only element out of the tree. Counted
    only while a11y-axstate finds that orphan on `settings.control.quickPanelHotkey`; the other recorders' orphans
    produced no issue (a12, Shortcuts section). A term of the upper bound of `labelsHiddenSwitch` (A-M9-T03b).
  reviewer: lead 2026-11-11 — accepted on in-app helper evidence (capabilities 3 indicators, storage 1 busy indicator, general 1 orphan); standalone repro inconclusive, revisit in M11
