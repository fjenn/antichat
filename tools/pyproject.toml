[project]
name = "antichat-tools"
version = "0.0.0"
description = "Python deps for AntiChat dev tooling (bootstrap step 9; stub models, fixtures)."
requires-python = "==3.13.*"
dependencies = [
    "numpy==2.5.4",
    "safetensors==0.8.0",
    "pyyaml==6.0.3",
    "tokenizers==0.23.3",
    "gguf",
    "pillow==13.0.0",
    "reportlab==5.1.0",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pypdf==6.21.4",
    "xlwt==1.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
gguf = { path = "../Binaries/llama.cpp/gguf-py", editable = true }

[dependency-groups]
dev = [
    "pytest==8.4.2",
]
