# Flips the switch ${ID} until its row shows ${STATE} (on|off). A single tap
# sometimes does not arrive on the iOS simulator (see _open-drawer.yaml).
appId: ${APP_ID}
---
- repeat:
    while:
      notVisible:
        id: ${ID}-${STATE}
    times: 4
    commands:
      - tapOn:
          id: ${ID}
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible:
    id: ${ID}-${STATE}
