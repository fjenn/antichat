# M2: the composer. Growth, the + sheet, a tool chip, an attachment, the
# model and answer-style menu, thinking with its sheet. In-memory backend.
appId: ${APP_ID}
env:
  TIMEOUT: 90000
---
- runFlow: _ready.yaml
- runFlow: _new-chat.yaml

# The pill grows with the text and stops at its largest size.
- tapOn:
    id: composer-input
- inputText: "A long question that wraps over several lines, so that the pill has to grow, and keeps going until it reaches its largest size and starts to scroll inside. It needs a few more words for that, and then a few more again, so here they are, one after the other, until the field is full."
- takeScreenshot: 60-grown
- eraseText: 400
- tapOn:
    id: greeting
    optional: true

# The + sheet: sources on top, tools under them.
- tapOn:
    id: composer-add
- assertVisible:
    id: attach-photos
- assertVisible:
    id: tool-think
- takeScreenshot: 61-attach-sheet
- tapOn:
    id: tool-think
- assertVisible:
    id: composer-chip-think
- tapOn:
    id: composer-add
- tapOn:
    id: attach-photos
- extendedWaitUntil:
    visible:
      id: composer-attachment
    timeout: 5000
- takeScreenshot: 62-chip-and-attachment

# Model and answer style live in the title.
- runFlow: _model-menu.yaml
- takeScreenshot: 63-model-menu
- tapOn: "Think.*"

# A thinking answer: the row above it opens the model's own text.
- runFlow:
    file: _send.yaml
    env:
      TEXT: Explain how transformers work, simply.
- extendedWaitUntil:
    visible:
      id: reasoning-row
    timeout: 15000
- runFlow: _answer-done.yaml
- assertVisible: "Thought for.*"
- takeScreenshot: 64-thought
- tapOn:
    id: reasoning-row
- assertVisible:
    id: reasoning-sheet
- takeScreenshot: 65-reasoning-sheet
- swipe:
    start: 50%, 55%
    end: 50%, 99%
- waitForAnimationToEnd:
    timeout: 2000

# Back to the fast style for the next flow.
- runFlow: _model-menu.yaml
- tapOn: "Fast.*"
