# M2.T04 (R-220, R-300; blueprint E §E.2.2): one entry per model key the signed catalog ships.
# Source: docs/research/06-models/model-matrix.md §1 (Normal pins), §2 (roles), §9.2 (Evil pins), §11 (D-016/D-018).
# `catalog-tool build` adds per file: size + sha256 (HF `lfs.oid`, or hashed once anonymously), the HF commit URL as
# `sources[0]`, and `footprint.weights_gb` = Σ sizes / 1e9. Everything else here is authored.
#   files      include globs (`*` also matches `/`); `.gitattributes` is never shipped.
#   footprint  kv_per_token_kb, overhead_gb, active_gb (decode bytes for the speed guard; default = weights) —
#              back-computed from the model-matrix §2.1 / §9.3 resident column (resident = w + kv×ctx/1e6 + o).
#   requires   companion entries always installed with this one (text encoder, VAE, …).
# Not in the catalog yet (unassigned in M2; their tasks add them): stt-fb, tts-stream (no files at the
# pinned commit), tts-multi (no licence tag), bg/bg-lite (Apple Vision is the default),
# img-mlx, chat-lfm3, the *-alt Evil builds.
defaults:
  apache: &apache {license: Apache-2.0, license_url: "https://www.apache.org/licenses/LICENSE-2.0", noncommercial_ok: false}
  mit: &mit {license: MIT, license_url: "https://opensource.org/license/mit", noncommercial_ok: false}
  ccby: &ccby {license: CC-BY-4.0, license_url: "https://creativecommons.org/licenses/by/4.0/", noncommercial_ok: false}
  mlx: &mlx ["*.safetensors", "*.json", "*.jinja", "*.txt", "README.md"]

