      chat: {normal: {model: chat-g26, ctx: 32768, step_down: chat-9b-q4}, evil: {model: evil-g26, ctx: 32768, step_down: evil-9b}, fast_first: chat-0.8b}
      embed: embed
      rerank: rerank
      title: "@chat_fast"
      voice: *voice_t1
      stt_multi: stt-multi
      photo: [img-klein-q8, img-erase]
      video: [vid-5b, vid-i2v]
    S4:
      photo: [img-klein-q8, img-zit-q8, img-erase]
  T2-36:
    S1:
      chat: {normal: {model: chat-35b-q4, ctx: 16384, step_down: chat-g26}, evil: {model: evil-35b-q4, ctx: 16384, step_down: evil-g26}, fast_first: chat-0.8b}
