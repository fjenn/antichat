# M7.T01 step 6 (R-253, G-029): the keyless search engines, compiled into catalog.json `search_engines` by
# `catalog-tool build` and signed with the rest of the catalog. The app overrides its code defaults
# (Packages/Tools/Sources/AntiChatTools/Search/Engines/) by id only after signature verification; an id the build
# does not compile is ignored, so this file can disable or re-point an engine but never add one (no Google).
# Fields: catalog/README.md "search_engines". Schema: catalog/schema/search-engines.schema.json.
engines:
  - id: duckduckgo
    name: DuckDuckGo
    enabled: true
    kind: html
    parser: osaurus-ddg
    url_template: "https://html.duckduckgo.com/html/?q={q}&kl=wt-wt"
    safe_param: {off: "kp=-2", on: "kp=1"}
    min_app_version: "0.1.0"
  - id: brave
    name: Brave
    enabled: true
    kind: html
    parser: osaurus-brave
    url_template: "https://search.brave.com/search?q={q}&source=web"
    safe_param: {off: "safesearch=off", on: "safesearch=strict"}
    min_app_version: "0.1.0"
  - id: mojeek
    name: Mojeek
    enabled: true
    kind: html
    parser: xpath
    url_template: "https://www.mojeek.com/search?q={q}"
    xpaths:
      items: "//ul[contains(@class, 'results')]/li"
      title: ".//h2//text()"
      href: ".//h2/a/@href"
      body: ".//p[@class='s']//text()"
    safe_param: {off: "safe=0", on: "safe=1"}
    min_app_version: "0.1.0"
  - id: startpage
    name: Startpage
    enabled: true
    kind: html
    parser: xpath
    url_template: "https://www.startpage.com/sp/search?query={q}&cat=web&t=device&lui=english&language=english&segment=organic"
    xpaths:
      items: "//div[contains(@class, 'result css')][./a]"
      title: ".//h2//text()"
      href: "./a/@href"
      body: ".//p//text()"
    safe_param: {off: "qadf=none", on: "qadf=heavy"}
    drop_url_prefixes: ["https://www.google.com"]
    min_app_version: "0.1.0"
  - id: wikipedia
    name: Wikipedia
    enabled: true
    kind: declarative
    parser: declarative
    url_template: "https://{lang}.wikipedia.org/w/api.php"
    endpoint:
      url: "https://{lang}.wikipedia.org/w/api.php"
      method: GET
      headers: {}
      query:
        - {name: action, value: query}
        - {name: list, value: search}
        - {name: srsearch, value: "{{raw_query}}"}
        - {name: format, value: json}
        - {name: srlimit, value: "10"}
      body: []
      response: {resultsPath: query.search, item: {title: title, snippet: snippet, publishedDate: timestamp}}
      timeout: 5
    url_from_title: "https://{lang}.wikipedia.org/wiki/{title}"
    safe_param: {off: "", on: ""}
    min_app_version: "0.1.0"
  - id: bing
    name: Bing
    enabled: false
    kind: html
    parser: osaurus-bing
    url_template: "https://www.bing.com/search?q={q}&count=10"
    safe_param: {off: "adlt=off", on: "adlt=strict"}
    min_app_version: "0.1.0"
