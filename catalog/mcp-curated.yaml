# M7.T06 step 8 (R-081 AC4, P-files-tools-12): the "Popular connections" list, compiled into catalog.json
# `mcp_curated` by `catalog-tool build` and signed with the rest of the catalog. Display-only data: nothing connects
# until the user adds one (R-081 AC1). Prefilled from the vendored Osaurus MCPProviderTemplate (osaurus@2922745),
# filtered to remote servers whose auth AntiChat supports (none, pasted bearer token, OAuth 2.1 with DCR or CIMD;
# manual-OAuth vendors such as Asana, Slack, HubSpot left out). A readOnlyHint tool of a server listed here (verified
# catalog only) starts on Always allow; everything else asks. `cimd_only` entries stay hidden until AntiChat's client
# metadata document is published (M7.T07).
# Live probe 2026-11-05 (POST initialize, 2025-11-25): huggingface, deepwiki, exa_search answered 200; the others
# 401 with a WWW-Authenticate challenge (reachable, sign-in needed). Fields: catalog/README.md "mcp_curated".
